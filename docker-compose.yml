name: banking-mds-pipeline

networks:
  banking-mds-net:
    name: banking-mds-net
    driver: bridge

volumes:
  postgres_data:
  airflow_db_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:
  minio_data:

services:

  # ============================================================================
  # PostgreSQL OLTP source — base bancaire, CDC activé (wal_level=logical)
  # ============================================================================
  postgres:
    image: postgres:16
    container_name: banking_postgres
    restart: unless-stopped
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_replication_slots=4"
      - "-c"
      - "max_wal_senders=4"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-mds-net

  # ============================================================================
  # Zookeeper — coordination du cluster Kafka
  # ============================================================================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: banking_zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT}
      ZOOKEEPER_TICK_TIME: ${ZOOKEEPER_TICK_TIME}
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    networks:
      - banking-mds-net

  # ============================================================================
  # Kafka — broker de messages (CDC events)
  # ============================================================================
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: banking_kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: ${KAFKA_BROKER_ID}
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:${ZOOKEEPER_CLIENT_PORT}"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_BROKER_PORT},PLAINTEXT_INTERNAL://kafka:${KAFKA_INTERNAL_PORT}
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:${KAFKA_BROKER_PORT},PLAINTEXT_INTERNAL://0.0.0.0:${KAFKA_INTERNAL_PORT}
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "${KAFKA_BROKER_PORT}:${KAFKA_BROKER_PORT}"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - banking-mds-net

  # ============================================================================
  # Kafka Connect + Debezium — connecteur CDC Postgres -> Kafka
  # ============================================================================
  debezium:
    image: debezium/connect:2.7.3.Final
    container_name: banking_debezium
    restart: unless-stopped
    depends_on:
      - kafka
      - postgres
    environment:
      BOOTSTRAP_SERVERS: "kafka:${KAFKA_INTERNAL_PORT}"
      GROUP_ID: ${CONNECT_GROUP_ID}
      CONFIG_STORAGE_TOPIC: ${CONNECT_CONFIG_STORAGE_TOPIC}
      OFFSET_STORAGE_TOPIC: ${CONNECT_OFFSET_STORAGE_TOPIC}
      STATUS_STORAGE_TOPIC: ${CONNECT_STATUS_STORAGE_TOPIC}
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_REST_ADVERTISED_HOST_NAME: debezium
    ports:
      - "${CONNECT_PORT}:8083"
    networks:
      - banking-mds-net

  # ============================================================================
  # MinIO — data lake S3-compatible pour le stockage brut des events CDC
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: banking_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-mds-net

  # ============================================================================
  # PostgreSQL dédié aux métadonnées Airflow (distinct du Postgres source)
  # ============================================================================
  airflow-db:
    image: postgres:16
    container_name: banking_airflow_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AIRFLOW_DB}
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    ports:
      - "${AIRFLOW_DB_PORT}:5432"
    volumes:
      - airflow_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - banking-mds-net

  # ============================================================================
  # Airflow init — migration DB + création de l'utilisateur admin (one-shot)
  # ============================================================================
  airflow-init:
    image: ${AIRFLOW_IMAGE}
    container_name: banking_airflow_init
    depends_on:
      airflow-db:
        condition: service_healthy
    environment: &airflow-common-env
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@airflow-db/${AIRFLOW_DB}"
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW_UID: ${AIRFLOW_UID}
      # Variables applicatives dont les DAGs ont besoin (MinIO, Snowflake, Postgres source)
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}
      POSTGRES_HOST: ${POSTGRES_DEBEZIUM_HOST}
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate
        airflow users create \
          --username "${AIRFLOW_ADMIN_USER}" \
          --password "${AIRFLOW_ADMIN_PASSWORD}" \
          --firstname "${AIRFLOW_ADMIN_FIRSTNAME}" \
          --lastname "${AIRFLOW_ADMIN_LASTNAME}" \
          --role Admin \
          --email "${AIRFLOW_ADMIN_EMAIL}" || true
    networks:
      - banking-mds-net

  # ============================================================================
  # Airflow webserver — orchestration du pipeline (UI sur AIRFLOW_WEBSERVER_PORT)
  # ============================================================================
  airflow-webserver:
    image: ${AIRFLOW_IMAGE}
    container_name: banking_airflow_webserver
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    command: webserver
    ports:
      - "${AIRFLOW_WEBSERVER_PORT}:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
    networks:
      - banking-mds-net

  # ============================================================================
  # Airflow scheduler — planification des DAGs (CDC -> dbt -> Snowflake)
  # ============================================================================
  airflow-scheduler:
    image: ${AIRFLOW_IMAGE}
    container_name: banking_airflow_scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-common-env
    command: scheduler
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./airflow/logs:/opt/airflow/logs
      - ./airflow/plugins:/opt/airflow/plugins
      - ./banking_dbt:/opt/airflow/banking_dbt
    networks:
      - banking-mds-net

  # ============================================================================
  # dbt — transformations (star schema, SCD2) vers Snowflake
  # Ne démarre pas automatiquement : docker compose --profile tools run dbt <cmd>
  # ============================================================================
  dbt:
    image: ghcr.io/dbt-labs/dbt-snowflake:1.8.latest
    container_name: banking_dbt
    profiles: ["tools"]
    environment:
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA}
      DBT_PROFILES_DIR: ${DBT_PROFILES_DIR}
    working_dir: /usr/app
    volumes:
      - ./banking_dbt:/usr/app
    networks:
      - banking-mds-net